name: Build and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      shell: pwsh

    - name: Install Tesseract OCR
      run: |
        choco install tesseract --no-progress
        echo "C:\Program Files\Tesseract-OCR" >> $env:GITHUB_PATH
      shell: pwsh

    - name: Copy Tesseract Files to Project
      run: |
        New-Item -ItemType Directory -Force -Path tesseract
        Copy-Item -Path "C:\Program Files\Tesseract-OCR\*" -Destination "tesseract" -Recurse -Force
      shell: pwsh

    - name: Build Executable with PyInstaller
      run: |
        pyinstaller --onefile --noconsole --noconfirm --name AutoActivateOffice-Telephone --clean --paths . --distpath ./dist --workpath ./build src/main.py
      shell: pwsh

    - name: Package Portable Directory Structure
      run: |
        New-Item -ItemType Directory -Force -Path dist\AutoActivateOffice-Telephone\Logs
        New-Item -ItemType Directory -Force -Path dist\AutoActivateOffice-Telephone\tesseract
        Copy-Item -Path "dist\AutoActivateOffice-Telephone.exe" -Destination "dist\AutoActivateOffice-Telephone\"
        Copy-Item -Path "tesseract\*" -Destination "dist\AutoActivateOffice-Telephone\tesseract" -Recurse -Force
        Copy-Item -Path "README.md" -Destination "dist\AutoActivateOffice-Telephone\"
        Copy-Item -Path "requirements.txt" -Destination "dist\AutoActivateOffice-Telephone\"
      shell: pwsh

    - name: Compress Build Artifact
      run: |
        Compress-Archive -Path dist\AutoActivateOffice-Telephone -DestinationPath dist\AutoActivateOffice-Telephone.zip -Force
      shell: pwsh

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: AutoActivateOffice Telephone Helper v1.0.${{ github.run_number }}
        draft: false
        prerelease: false
        files: dist/AutoActivateOffice-Telephone.zip
        body: |
          Auto-generated release for the AutoActivateOffice Telephone Helper.
          
          This release contains the portable Windows helper application pre-bundled with Tesseract OCR.
          
          ### Installation
          1. Download the `AutoActivateOffice-Telephone.zip` file below.
          2. Extract the zip file directly onto your USB flash drive.
          3. Double-click `AutoActivateOffice-Telephone.exe` to run the tool.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
