name: Build and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      shell: pwsh

    - name: Install Tesseract OCR
      run: |
        choco install tesseract --no-progress
        echo "C:\Program Files\Tesseract-OCR" >> $env:GITHUB_PATH
      shell: pwsh

    - name: Copy Tesseract Files to Project
      run: |
        New-Item -ItemType Directory -Force -Path tesseract
        Copy-Item -Path "C:\Program Files\Tesseract-OCR\*" -Destination "tesseract" -Recurse -Force
      shell: pwsh

    - name: Build Executable with PyInstaller
      run: |
        pyinstaller --onefile --noconsole --noconfirm --name OfficePhoneActivator --clean --paths . --icon "assets/app_icon.ico" --add-data "tesseract;tesseract" --add-data "assets;assets" --distpath ./dist --workpath ./build src/main.py
      shell: pwsh

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Office Phone Activator v1.0.${{ github.run_number }}
        draft: false
        prerelease: false
        files: dist/OfficePhoneActivator.exe
        body: |
          Auto-generated release for the Office Phone Activator.
          
          This release contains the portable Windows helper application as a single, standalone executable pre-bundled with Tesseract OCR and custom app icon.
          
          ### Running the Application
          1. Download the `OfficePhoneActivator.exe` file below.
          2. Double-click to run the tool. No installation or extraction is required!
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

